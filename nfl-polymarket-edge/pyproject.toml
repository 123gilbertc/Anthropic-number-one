[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-edge"
version = "0.1.0"
description = "NFL probability engine and Polymarket edge scanner with honest walk-forward backtesting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "requests>=2.31"]

[project.scripts]
nfl-edge = "nfl_edge.cli:main"

[tool.setuptools.packages.find]
include = ["nfl_edge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
