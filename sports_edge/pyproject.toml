[project]
name = "sports-edge"
version = "0.1.0"
description = "Live sports probability and market-overreaction research system (research and paper trading only)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.13,<2",
    "httpx>=0.27,<1",
    "websockets>=13,<16",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "duckdb>=1.0,<2",
    "scikit-learn>=1.5,<2",
    "lightgbm>=4.3,<5",
    "cryptography>=43,<47",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "ruff>=0.6",
]

[project.scripts]
sports-edge = "sports_edge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sports_edge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E701"]
